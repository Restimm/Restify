<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b09">
  <title>Restify</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="app">
    <!-- HEADER & STATUS USER -->
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M12 23V8l13-3v15" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <ellipse cx="8.5" cy="23.5" rx="3.5" ry="2.5" fill="currentColor"/>
            <ellipse cx="21.5" cy="20.5" rx="3.5" ry="2.5" fill="currentColor"/>
          </svg>
        </span>
        <h1>Restify</h1>
      </div>
      <div class="user-badge" id="userBadgeContainer">
        <span id="userNameDisplay">Tamu</span>
        <button type="button" class="btn-auth" id="loginLogoutBtn">Login</button>
      </div>
    </header>

    <!-- FORMS INPUT -->
    <section class="form-section">
      <form id="addLinkForm" class="input-form">
        <input type="url" id="linkInput" placeholder="Tempel link YouTube..." required>
        <button type="submit" id="addLinkButton">Tambah</button>
      </form>
    </section>

    <section class="form-section">
      <form id="searchForm" class="input-form">
        <input type="text" id="searchInput" placeholder="Cari judul lagu yang tersimpan..." required>
        <button type="submit" id="searchButton">Cari</button>
      </form>
    </section>

    <!-- TAB NAVIGASI UTAMA -->
    <nav class="main-nav" aria-label="Navigasi Utama">
      <button class="nav-tab active" data-tab="all">Daftar Putar</button>
            <button class="nav-tab" data-tab="playlists">Playlist Saya</button>
    </nav>

    <!-- KONTEN TAB: PLAYLIST ACTION BAR -->
    <div id="playlistSection" class="sub-filter-bar" hidden>
      <button class="btn-secondary" id="createPlaylistBtn">+ Buat Playlist Baru</button>
      <div id="playlistChipsContainer" class="playlist-chips"></div>
    </div>

    <!-- DAFTAR LAGU -->
    <section aria-labelledby="resultsHeading">
      <div class="section-heading">
        <h2 id="resultsHeading">Daftar Putar Utama</h2>
        <span class="status" id="status" role="status" aria-live="polite"></span>
      </div>
      <div class="results" id="results"></div>
    </section>
  </main>

  <!-- PLAYER BOTTOM BAR -->
  <section class="player" aria-label="Pemutar Musik">
    <div class="player-inner">
      <div class="now-playing">
        <img class="cover" id="playerCover" alt="" src="">
        <div class="now-playing-copy">
          <p class="now-playing-title" id="playerTitle">Belum ada lagu</p>
          <p class="now-playing-artist" id="playerArtist">-</p>
        </div>
      </div>

      <div class="controls">
        <button class="control-button" id="shuffleBtn" type="button" aria-label="Acak" title="Shuffle Mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20l16-16M21 16v5h-5M15 15l5 5M4 4l5 5"/></svg>
        </button>
        <button class="control-button" id="prevButton" type="button" aria-label="Sebelumnya" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zm3 7 10 7V5z"/></svg>
        </button>
        <button class="control-button primary" id="playButton" type="button" aria-label="Putar" disabled>
          <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
        <button class="control-button" id="nextButton" type="button" aria-label="Berikutnya" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM5 5v14l10-7z"/></svg>
        </button>
      </div>

      <div class="progress-area">
        <span id="currentTime">0:00</span>
        <input class="progress" id="progress" type="range" min="0" max="1000" value="0" aria-label="Posisi lagu" disabled>
        <span id="duration">0:00</span>
      </div>
    </div>
  </section>

  <!-- MODAL LOGIN POPUP -->
  <div class="modal" id="loginModal" hidden>
    <div class="modal-content">
      <h3>Masukan Nama</h3>
      <p>Masukan nama panggilan untuk mengunggah lagu.</p>
      <form id="modalLoginForm">
        <input type="text" id="modalNameInput" placeholder="Masukan nama..." class="modal-input" required>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="closeModalBtn">Batal</button>
          <button type="submit" class="btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL PILIH / TAMBAH KE PLAYLIST -->
  <div class="modal" id="playlistModal" hidden>
    <div class="modal-content">
      <h3>Tambah ke Playlist</h3>
      <p id="playlistModalSub">Pilih playlist tujuan:</p>
      <div id="playlistListOptions" class="modal-list-options"></div>
      <div class="modal-actions" style="margin-top: 16px;">
        <button type="button" class="btn-secondary" id="closePlaylistModalBtn">Tutup</button>
      </div>
    </div>
  </div>

  <!-- Host pemutar YouTube tersembunyi -->
  <div id="ytPlayerHost"></div>
</body>
</html>
